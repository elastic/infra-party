# Respond to @claude mentions in issue comments
# Can make code changes, create branches, and open PRs

name: Claude Mention (Issue)

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  respond:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.issue.pull_request == null &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps
        with:
          install-gcloud: 'false'

      - name: Run Claude Mention Handler
        uses: elastic/ai-github-actions/workflows/mention-in-issue/rwxp@v0
        with:
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
