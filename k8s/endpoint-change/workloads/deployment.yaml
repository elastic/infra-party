apiVersion: apps/v1
kind: Deployment
metadata:
  name: loggen
  namespace: infra-party-endpoint-change
  labels:
    app: loggen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loggen
  template:
    metadata:
      labels:
        app: loggen
        tier: frontend
        version: v1
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                echo "[app] heartbeat $(date -Iseconds) tier=$TIER version=$VERSION"
                sleep 5
              done
          env:
            - name: TIER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tier']
            - name: VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['version']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
